general {
    lock_cmd = pidof hyprlock || hyprlock          # dbus/sysd lock command (loginctl lock-session)
    #unlock_cmd =      # same as above, but unlock
    before_sleep_cmd = loginctl lock-session    # command ran before sleep
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'  # command ran after sleep
    ignore_dbus_inhibit = false             # whether to ignore dbus-sent idle-inhibit requests (used by e.g. firefox or steam)
    inhibit_sleep = 1
}

listener {
    timeout = 240                           # in seconds
    on-timeout = loginctl lock-session # command to run when timeout has passed
	on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
	timeout = 120
	on-timeout = ~/PATH/backlight.sh --set 10
	on-resume = ~/PATH/backlight.sh --reset
}

listener {
	timeout = 10
	on-timeout = pgrep hyprlock && hyprctl dispatch 'hl.dsp.dpms({ action = "off" })' # turn screen off if hyprlock running
	on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
	ignore_inhibit = true
}


listener {
	timeout = 250
	on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })' # turn screen off when hyprlock is first activated
	on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
